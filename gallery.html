<main>
<h2>Photo gallery</h2>
<div class="tabs" id="galTabs">
  <button class="btn sm" onclick="filterGallery('All',this)">All</button>
  <button class="btn alt sm" onclick="filterGallery('Beach',this)">Beach</button>
  <button class="btn alt sm" onclick="filterGallery('Nature',this)">Nature</button>
  <button class="btn alt sm" onclick="filterGallery('Heritage',this)">Heritage</button>
  <button class="btn alt sm" onclick="filterGallery('Adventure',this)">Adventure</button>
  <button class="btn alt sm" onclick="filterGallery('City',this)">City</button>
</div>
<div class="gal" id="galGrid">
    <div role="button" tabindex="0" class="g0" style="--h:150px" data-t="Beach" data-place="Goa" onclick="openPhoto(this)" aria-label="Goa">🏖️</div>
    <div role="button" tabindex="0" class="g1" style="--h:187px" data-t="Nature" data-place="Kerala" onclick="openPhoto(this)" aria-label="Kerala">🛶</div>
    <div role="button" tabindex="0" class="g2" style="--h:224px" data-t="Heritage" data-place="Jaipur" onclick="openPhoto(this)" aria-label="Jaipur">🏰</div>
    <div role="button" tabindex="0" class="g3" style="--h:171px" data-t="Adventure" data-place="Manali" onclick="openPhoto(this)" aria-label="Manali">🏔️</div>
    <div role="button" tabindex="0" class="g4" style="--h:208px" data-t="Beach" data-place="Bali" onclick="openPhoto(this)" aria-label="Bali">🌴</div>
    <div role="button" tabindex="0" class="g5" style="--h:155px" data-t="City" data-place="Dubai" onclick="openPhoto(this)" aria-label="Dubai">🌆</div>
    <div role="button" tabindex="0" class="g0" style="--h:192px" data-t="Beach" data-place="Goa" onclick="openPhoto(this)" aria-label="Goa">🌅</div>
    <div role="button" tabindex="0" class="g1" style="--h:229px" data-t="Nature" data-place="Kerala" onclick="openPhoto(this)" aria-label="Kerala">🐘</div>
    <div role="button" tabindex="0" class="g2" style="--h:176px" data-t="Heritage" data-place="Jaipur" onclick="openPhoto(this)" aria-label="Jaipur">🕌</div>
    <div role="button" tabindex="0" class="g3" style="--h:213px" data-t="Adventure" data-place="Manali" onclick="openPhoto(this)" aria-label="Manali">❄️</div>
    <div role="button" tabindex="0" class="g4" style="--h:160px" data-t="Heritage" data-place="Bali" onclick="openPhoto(this)" aria-label="Bali">🛕</div>
    <div role="button" tabindex="0" class="g5" style="--h:197px" data-t="Adventure" data-place="Dubai" onclick="openPhoto(this)" aria-label="Dubai">🏜️</div>
</div>
</main>

<footer>© 2026 Musafir Travels · Surat, Gujarat · support@musafir.example · Mon–Sat, 9am–7pm</footer>
